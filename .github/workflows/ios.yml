name: iOS build

# Сборка на облачном Mac: генерируем проект, собираем под симулятор,
# запускаем приложение на нескольких экранах и сохраняем скриншоты в артефакты.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]:
                      print(d["udid"]); sys.exit()
          ')
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          STATUS=0
          xcodebuild \
            -project Intelegent.xcodeproj \
            -scheme Intelegent \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || STATUS=$?
          # Короткая выжимка: ошибки и предупреждения по нашему коду
          grep -E "error:|warning: .*/Intelegent/|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          # Ошибки компиляции — аннотациями: их видно на странице запуска и через API без скачивания логов
          grep -E "^/.*:[0-9]+:[0-9]+: error: " build.log | sort -u | head -50 | \
            sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#" || true
          exit $STATUS

      - name: Screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          BUNDLE=shop.intelegent.app

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Красивый статус-бар на скриншотах
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --batteryState charged --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"

          mkdir -p screenshots
          for theme in dark light; do
            for screen in home catalog section product; do
              xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -uiScreen "$screen" -theme "$theme"
              sleep 12
              xcrun simctl io "$UDID" screenshot "screenshots/${theme}-${screen}.png"
            done
          done
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
